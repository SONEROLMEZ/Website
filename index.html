<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soner Ölmez</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            /* Full-page Li River background using your Base44 hosted asset */
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                              url('https://last-man-horizon.base44.app/_next/image?url=%2F_next%2Fstatic%2Fmedia%2Fbg-totems.0e1f72a4.jpg&w=3840&q=75');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.85;
            margin-bottom: 24px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }

        .section {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 24px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            margin-bottom: 24px;
        }

        .section h2 {
            font-size: 1.4rem;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .section p {
            font-size: 1rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
        }

        a {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Soner Ölmez</h1>
            <p class="subtitle">Personal Website & Portfolio</p>
        </header>

        <main>
            <div class="section">
                <h2>About Me</h2>
                <p>Welcome to my website! This page is hosted using GitHub Pages.</p>
            </div>

            <div class="section">
                <h2>Projects</h2>
                <p>Details about ongoing and completed projects will be updated here.</p>
            </div>

            <div class="section">
                <h2>Contact</h2>
                <p>You can find my GitHub profile here.</p>
            </div>
        </main>
    </div>

</body>
</html>
