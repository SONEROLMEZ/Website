<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R ÖLMEZ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            background-color: #000000;
            min-height: 100vh;
            /* Full-page Li River background */
            background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), 
                              url('https://last-man-horizon.base44.app/_next/image?url=%2F_next%2Fstatic%2Fmedia%2Fbg-totems.0e1f72a4.jpg&w=3840&q=75');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        /* Top Navigation Header */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
        }

        .nav-logo {
            font-weight: 700;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 20px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .nav-links a:hover {
            opacity: 1;
        }

        /* Main Hero Title Styling */
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            text-align: center;
            padding: 20px;
        }

        .big-title {
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            line-height: 1;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
        }

        .sub-caption {
            margin-top: 15px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.75;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">R ÖLMEZ</div>
        <div class="nav-links">
            <a href="#">TOTEMS</a>
            <a href="#">HORIZONS</a>
            <a href="#">PLACES</a>
            <a href="#">JOURNAL</a>
            <a href="#">ABOUT</a>
            <a href="#">CONTACT</a>
        </div>
    </nav>

    <div class="hero">
        <div class="big-title">R ÖLMEZ</div>
        <div class="sub-caption">Last Man Standing</div>
    </div>

</body>
</html>
