<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waikiki Beach Sunset | Last Man Standing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            /* Full-page Li River / Zhangjiajie mountain background */
            background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                              url('https://images.unsplash.com/photo-1528164344705-47542687990d?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 20px;
        }
        header {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            font-size: 3rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
        }
        nav {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid transparent;
            transition: border-color 0.3s ease;
        }
        nav a:hover {
            border-bottom-color: #ffffff;
        }
        main {
            max-width: 1000px;
            margin: 40px auto;
            width: 100%;
        }
        .section-card {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 20px;
        }
        .section-card h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Waikiki Beach Sunset</h1>
        <p class="subtitle">Last Man Standing</p>
        <nav>
            <a href="#totems">Totems</a>
            <a href="#horizons">Horizons</a>
            <a href="#places">Places</a>
            <a href="#journal">Journal</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <div class="section-card">
            <h2>Featured Journeys</h2>
            <p>Places that left a mark on me.</p>
        </div>
    </main>

</body>
</html>
